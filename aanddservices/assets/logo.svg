<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon -->
    <path d="M30 4 L56 16 L56 44 L30 58 L4 44 L4 16 Z" fill="url(#shieldGrad)" stroke="url(#leafGrad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Stylized Grass Blades / Seedling -->
    <path d="M30 46 C30 32 20 22 14 18 C16 28 23 38 30 46 Z" fill="url(#leafGrad)" />
    <path d="M30 46 C32 28 42 16 48 12 C44 24 37 38 30 46 Z" fill="#4ade80" />
    <path d="M30 46 C30 26 28 14 30 8 C32 18 34 32 30 46 Z" fill="#86efac" />
    
    <!-- Accent golden dot -->
    <circle cx="30" cy="8" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(78, 16)">
    <!-- Primary Brand Name -->
    <text x="0" y="27" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">
      A &amp; D <tspan fill="#4ade80">SERVICES</tspan>
    </text>
    
    <!-- Tagline & Specialization -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#a7f3d0" letter-spacing="2.2" text-transform="uppercase">
      Acreage Lawn Care &amp; Weed Control &bull; Otsego, MN
    </text>
  </g>
</svg>
