<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="limeFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="60%" stop-color="#9ecb3b"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#028bdb"/>
    </linearGradient>
    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon (Hex / Shield Asphalt Paving Badge) -->
  <g transform="translate(10, 8)">
    <!-- Base Shield -->
    <path d="M32 2 L60 16 L60 48 L32 62 L4 48 L4 16 Z" fill="url(#shieldGrad)" stroke="url(#cyanAccent)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Pavement Asphalt Road Lines (Subtle) -->
    <path d="M12 36 L52 36" stroke="#1e293b" stroke-width="3" stroke-dasharray="4 3"/>
    
    <!-- Interlocking FlowSeal Wave & Droplet -->
    <path d="M18 42 C 24 24, 38 20, 46 32 C 40 46, 26 48, 18 42 Z" fill="url(#limeFlow)" filter="url(#glowLime)"/>
    <path d="M28 22 C 32 14, 40 16, 44 24 C 38 28, 30 26, 28 22 Z" fill="url(#cyanAccent)"/>
    
    <!-- Asphalt Center Core -->
    <circle cx="32" cy="32" r="3.5" fill="#f8fafc"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(85, 20)">
    <!-- Brand Name -->
    <text x="0" y="26" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5" fill="#ffffff">
      FLOW<tspan fill="#a3e635">SEAL</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="2.2" fill="#38bdf8">
      SURFACE MAINTENANCE
    </text>
    <text x="168" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="1" fill="#94a3b8">
      • TWIN CITIES, MN
    </text>
  </g>
</svg>
